name: Cheap guards

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-automation-and-plurals:
    name: Fast deterministic guards
    runs-on: ubuntu-24.04
    container: swift:6.3.3-noble
    defaults:
      run:
        shell: bash
    steps:
      - name: Install guard prerequisites
        run: apt-get update && apt-get install -y --no-install-recommends git jq python3 ripgrep xxd

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Verify Swift toolchain
        run: |
          ./script/check-toolchain.sh
          ./script/test-toolchain.sh

      - name: CI automation unit tests
        run: ./script/test-ci-automation.sh

      - name: Public-seed source policy
        run: ./script/check_public_seed_source.sh

      - name: Plural localization guards
        run: ./script/check_plural_guards.sh

      - name: Test wait guardrail tests
        run: ./script/test-test-wait-guard.sh

      - name: Test wait policy
        env:
          TEST_WAIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./script/check_test_waits.sh

      - name: Formatter guardrail tests
        run: ./script/test-format.sh

      - name: Swift format lint
        env:
          FORMAT_LINT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./script/format.sh --lint

      - name: Ghostty license pin guardrail tests
        run: ./script/test-ghostty-license-pins.sh

      - name: Ghostty license pins
        run: ./script/check_ghostty_license_pins.sh

      - name: Ghostty source extension tests
        run: python3 script/test_prepare_ghostty_source.py
