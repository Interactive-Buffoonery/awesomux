name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interpreted:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8

  complete:
    name: CodeQL interpreted complete
    if: always()
    needs: [interpreted]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify every analysis completed successfully
        env:
          INTERPRETED_RESULT: ${{ needs.interpreted.result }}
        run: |
          set -euo pipefail

          printf 'Interpreted analyses: %s\n' "$INTERPRETED_RESULT"

          if [[ "$INTERPRETED_RESULT" != "success" ]]; then
            echo "::error::one or more interpreted CodeQL analysis jobs did not succeed"
            exit 1
          fi
