name: Tint contrast

on:
  pull_request:
    paths:
      - "Sources/DesignSystem/Tokens/AwColor.swift"
      - "Sources/awesoMux/Views/SidebarGroupView.swift"
      - "Sources/awesoMux/Views/SidebarGroupHeaderView.swift"
      - "Sources/awesoMux/Views/SidebarPinnedSectionView.swift"
      - "Sources/awesoMux/Views/SidebarSessionTile.swift"
      - "Tests/DesignSystemTests/AwColorTests.swift"
      - "Tests/DesignSystemTests/SidebarTintContrastTests.swift"
      - ".github/workflows/tint-contrast.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tint-contrast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ vars.NATIVE_CI_RUNNER || 'macos-26' }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Prepare native build
        uses: ./.github/actions/prepare-native
        with:
          save-cache: "false"

      - name: Run sidebar tint contrast tests
        run: |
          output="$RUNNER_TEMP/sidebar-tint-contrast.log"
          ./script/swift-test.sh --filter SidebarTintContrastTests 2>&1 | tee "$output"
          if ! grep -Eq 'Test run with [1-9][0-9]* tests( in [1-9][0-9]* suites?)? passed' "$output"; then
            echo "Sidebar tint contrast filter ran no tests" >&2
            exit 1
          fi
