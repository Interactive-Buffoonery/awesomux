name: Swift CodeQL

on:
  schedule:
    - cron: "17 8 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Analyze (swift)
    runs-on: ${{ vars.NATIVE_CI_RUNNER || 'macos-26' }}
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: write
    env:
      AWESOMUX_GHOSTTY_OPTIMIZE: ReleaseFast
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Prepare native build
        uses: ./.github/actions/prepare-native
        with:
          save-cache: "true"

      - name: Resolve Swift dependencies
        run: swift package resolve

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: swift
          build-mode: manual

      - name: Build Swift sources
        run: swift build --arch arm64

      - name: Analyze
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
