name: Swift CodeQL

on:
  schedule:
    - cron: "17 8 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Analyze (swift)
    # CodeQL manual-build tracing requires macOS 26, Xcode 26 and Swift 6.3.
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: write
    env:
      AWESOMUX_GHOSTTY_OPTIMIZE: ReleaseFast
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Prepare native build
        uses: ./.github/actions/prepare-native
        with:
          toolchain: swift-codeql
          save-cache: "true"

      - name: Resolve Swift dependencies
        run: swift package resolve

      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: swift
          build-mode: manual

      - name: Build Swift sources
        run: swift build --arch arm64

      - name: Analyze
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
